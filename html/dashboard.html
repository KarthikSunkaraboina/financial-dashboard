<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - LoanEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar bg-primary navbar-dark">
  <div class="container">
    <span class="navbar-brand fw-bold">LoanEase</span>
    <div>
      <span id="userEmail" class="text-white small me-3"></span>
      <button onclick="logout()" class="btn btn-light btn-sm">Logout</button>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <h4>Hello, <span id="userName">User</span> 👋</h4>
  <p class="text-muted small">Welcome to your loan dashboard</p>

  <div class="row mt-4">
    <div class="col-md-6">
      <div class="card p-4 text-center">
        <h2>0</h2>
        <p>Active Loans</p>
        <a href="loan.html" class="btn btn-primary">Apply New Loan</a>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card p-4">
        <h5>Recent Activity</h5>
        <p class="text-muted small">No applications yet. Start by applying.</p>
        <div id="lastResult" class="d-none">
          <hr>
          <p class="small">Last check: <span id="lastStatus"></span></p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- PLACE THE CODE HERE - AT THE BOTTOM -->
<script src="js/auth.js"></script>
<script>
  // 1. This checks if user is logged in, if not -> sends to login.html
  checkAuth();

  // 2. Show logged in user's email
  const user = JSON.parse(localStorage.getItem("user") || "{}");
  if (user.email) {
    document.getElementById("userEmail").innerText = user.email;
    document.getElementById("userName").innerText = user.email.split("@")[0];
  }

  // 3. Show last loan result if exists
  const lastLoan = localStorage.getItem("lastLoanResult");
  if (lastLoan) {
    const data = JSON.parse(lastLoan);
    document.getElementById("lastResult").classList.remove("d-none");
    document.getElementById("lastStatus").innerText = data.eligible? "✅ Approved" : "❌ Rejected";
  }
</script>
</body>
</html>
