<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply Loan - LoanEase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<nav class="navbar bg-primary navbar-dark">
  <div class="container">
    <a href="dashboard.html" class="navbar-brand fw-bold">← LoanEase</a>
    <button onclick="logout()" class="btn btn-light btn-sm">Logout</button>
  </div>
</nav>

<div class="container mt-4" style="max-width: 700px;">
  <div class="card p-4 shadow-sm">
    <h4 class="fw-bold">Loan Application</h4>
    <p class="small text-muted">Fill details + upload docs for AI verification</p>
    <div class="row mt-3">
      <div class="col-md-6"><label>Loan Amount (₹)</label><input id="amount" class="form-control" type="number" placeholder="500000"></div>
      <div class="col-md-6"><label>Monthly Income (₹)</label><input id="income" class="form-control" type="number" placeholder="75000"></div>
      <div class="col-md-6 mt-3"><label>Tenure (months)</label><input id="tenure" class="form-control" type="number" placeholder="60" value="60"></div>
      <div class="col-md-6 mt-3"><label>Employment Type</label><select id="empType" class="form-select"><option>Salaried</option><option>Self-Employed</option><option>Business Owner</option></select></div>
      <div class="col-md-6 mt-3"><label>PAN Card (Image/PDF)</label><input id="panFile" type="file" class="form-control" accept=".pdf,.jpg,.png"></div>
      <div class="col-md-6 mt-3"><label>Bank Statement (PDF)</label><input id="bankFile" type="file" class="form-control" accept=".pdf"></div>
    </div>
    <button onclick="submitLoan()" id="submitBtn" class="btn btn-primary w-100 mt-4">Check Eligibility</button>
    <div id="loader" class="text-center mt-4 d-none">
      <div class="spinner-border text-primary"></div>
      <p class="small mt-2 fw-bold">Parsing PAN & Bank Statement...</p>
      <p class="small text-muted">This calls PanParser.java + BankStatementParser.java</p>
    </div>
  </div>
</div>

<!-- AUTH GUARD - MUST BE AT BOTTOM -->
<script src="js/auth.js"></script>
<script src="js/loan.js"></script>
<script>
  checkAuth(); // protects this page
</script>
</body>
</html>
